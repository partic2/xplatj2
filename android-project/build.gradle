buildscript {
    repositories {

		maven { url 'https://maven.aliyun.com/repository/public/' }
		google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.0+'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

def buildOpts = new Properties()
def propsFile = file('build-options.properties')
if (propsFile.exists()) {
	buildOpts.load(new FileInputStream(propsFile))
}


apply plugin: 'com.android.application'

android {
	namespace "partic2.pxseedloader"
    compileSdk 34
	lintOptions{
	 abortOnError false
	}
	splits {
		abi {
			enable true
			reset()
			include 'armeabi-v7a', 'arm64-v8a'
			universalApk true
		}
	}
	defaultConfig {
		//Android Studio need this to pack .so file for install debug.
		ndk {
			abiFilters 'armeabi-v7a','arm64-v8a'
		}
		minSdkVersion 21
		targetSdkVersion 34
	}
	signingConfigs{
		release{
			storeFile file('../tools/android.keystore')
			storePassword '123456'
			keyAlias 'public'
			keyPassword '123456'
		}
	}
	sourceSets{
		main{
			java{
				srcDirs '../commonj/src/main/java'
				srcDirs '../deps/PxpRpc/java/src'
				srcDirs '../deps/PxpRpc/runtime_bridge/java'
				srcDirs '../deps/SDL/android-project/app/src/main/java'
				if(!"true".equals(buildOpts.getProperty("noExtend"))){
					srcDirs+="src/extend/java"
				}
				if("true".equals(buildOpts.getProperty("enableGeckoView"))){
					srcDirs+="src/geckoview/java"
				}
			}
			resources{
				srcDirs '../commonj/src/main/resources'
			}
			assets{
				srcDirs '../commonj/src/main/assets'
			}
		}
	}
	compileOptions{
		targetCompatibility 8
		sourceCompatibility 8
	}
	buildTypes{
		release{
			signingConfig signingConfigs.release
		}
		debug{
			signingConfig signingConfigs.release
		}
	}
	aaptOptions{
		 ignoreAssetsPattern = ''
	}

}


dependencies {
	api fileTree(dir:'src/main/jar',include:['*.jar']);
	if ("true".equals(buildOpts.getProperty("enableGeckoView"))) {
		implementation "org.mozilla.geckoview:geckoview:110.0.20230227191043"
	}
}

// In this section you declare where to find the dependencies of your project
repositories {
    // Use jcenter for resolving your dependencies.
	maven { url 'https://maven.aliyun.com/repository/public/' }
	maven {
		url "https://maven.mozilla.org/maven2/"
	}
	google()
}
